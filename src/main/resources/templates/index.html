<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>社員一覧</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<div class="container mt-5">

<h1>社員一覧</h1>

<div class="row mb-4">

    <div class="col-md-6">
        <div class="card text-bg-primary">
            <div class="card-body">
                <h5 class="card-title">社員数</h5>
                <h2 th:text="${employeeCount} + ' 人'"></h2>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card text-bg-success">
            <div class="card-body">
                <h5 class="card-title">部署数</h5>
                <h2 th:text="${departmentCount} + ' 部署'"></h2>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">
            部署ごとの社員数
        </div>
        <div class="card-body">
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>部署</th>
                    <th>人数</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="stat : ${departmentStats}">
                    <td th:text="${stat[0]}"></td>
                    <td th:text="${stat[1]} + ' 人'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div class="d-flex justify-content-end mb-3">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-danger">
            ログアウト
        </button>
    </form>
</div>

<div class="mb-3">
    <a th:href="@{/new}" class="btn btn-primary">
        ＋ 社員を登録
    </a>

    <a th:href="@{/export/excel}" class="btn btn-success ms-2">
        📥 Excel出力
    </a>

    <a th:href="@{/export/csv}" class="btn btn-success">
        📃 CSV出力
    </a>

    <a th:href="@{/export/pdf}" class="btn btn-danger">
        PDF出力
    </a>
</div>

<form th:action="@{/}" method="get" class="row g-2 mb-3">

    <div class="col-auto">
        <input
                type="text"
                name="keyword"
                class="form-control"
                placeholder="名前で検索"
                th:value="${keyword}">
    </div>

    <div class="col-auto">
        <select name="department" class="form-select">
            <option value="">全部署</option>
            <option value="営業" th:selected="${department == '営業'}">営業</option>
            <option value="開発" th:selected="${department == '開発'}">開発</option>
            <option value="人事" th:selected="${department == '人事'}">人事</option>
            <option value="総務" th:selected="${department == '総務'}">総務</option>
        </select>
    </div>

    <div class="col-auto">
        <select name="sort" class="form-select">
            <option value="id" th:selected="${sort=='id'}">ID順</option>
            <option value="name" th:selected="${sort=='name'}">名前順</option>
            <option value="department" th:selected="${sort=='department'}">部署順</option>
            <option value="hireDate" th:selected="${sort=='hireDate'}">入社日順</option>
        </select>
    </div>

    <div class="col-auto">
        <select name="dir" class="form-select">
            <option value="asc" th:selected="${dir=='asc'}">昇順</option>
            <option value="desc" th:selected="${dir=='desc'}">降順</option>
        </select>
    </div>

    <div class="col-auto">
        <button type="submit" class="btn btn-primary">
            検索
        </button>
    </div>

</form>
<br>

<table class="table table-bordered table-hover">
    <tr class="table-dark">
        <th>ID</th>
        <th>名前</th>
        <th>メール</th>
        <th>部署</th>
        <th>入社日</th>
        <th>操作</th>
    </tr>

    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>

        <td>
            <a th:href="@{/employee/{id}(id=${employee.id})}"
               th:text="${employee.name}">
            </a>
        </td>

        <td th:text="${employee.email}"></td>
        <td th:text="${employee.department}"></td>

        <td th:text="${#temporals.format(employee.hireDate, 'yyyy/MM/dd')}"></td>

        <td>
            <a th:href="@{/edit/{id}(id=${employee.id})}"
               class="btn btn-warning btn-sm">
                編集
            </a>

            <a th:href="@{/delete/{id}(id=${employee.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('本当に削除しますか？');">
                削除
            </a>
        </td>
    </tr>
</table>

<div class="card mt-4">
    <div class="card-header">
        部署別グラフ
    </div>

    <div class="card-body">
        <canvas id="departmentChart"></canvas>
    </div>
</div>

<nav class="mt-4" th:if="${employeePage.totalPages > 1}">
    <ul class="pagination justify-content-center">

        <li class="page-item"
            th:classappend="${employeePage.first} ? 'disabled'">

            <a class="page-link"
               th:href="@{/(page=${employeePage.number-1},
                            keyword=${keyword},
                            department=${department},
                            sort=${sort},
                            dir=${dir})}">
                前へ
            </a>
        </li>

        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, employeePage.totalPages-1)}"
            th:classappend="${i == employeePage.number} ? 'active'">

            <a class="page-link"
               th:text="${i+1}"
               th:href="@{/(page=${i},
                            keyword=${keyword},
                            department=${department},
                            sort=${sort},
                            dir=${dir})}">
            </a>

        </li>

        <li class="page-item"
            th:classappend="${employeePage.last} ? 'disabled'">

            <a class="page-link"
               th:href="@{/(page=${employeePage.number+1},
                            keyword=${keyword},
                            department=${department},
                            sort=${sort},
                            dir=${dir})}">
                次へ
            </a>

        </li>

    </ul>
</nav>

</div>

<script th:inline="javascript">

const stats = [[${departmentStats}]];

const labels = [];
const data = [];

stats.forEach(function(item){
    labels.push(item[0]);
    data.push(item[1]);
});

new Chart(
    document.getElementById("departmentChart"),
    {
        type: "pie",
        data: {
            labels: labels,
            datasets: [{
                data: data
            }]
        }
    }
);

</script>

</body>
</html>
